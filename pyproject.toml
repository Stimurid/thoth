[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "thoth"
version = "0.1.0"
description = "Cold archive of locally-stored AI agent chats. Codex CLI, Claude Code, Cursor Composer. Incremental, per-day sliced, project-tagged. Companion to Nisaba."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Timur Shchukin", email = "timur@shchuk.in" },
]
keywords = ["ai-agents", "codex", "claude-code", "cursor", "archive", "backup", "chat-history"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Stimurid/thoth"
Repository = "https://github.com/Stimurid/thoth"
Issues = "https://github.com/Stimurid/thoth/issues"
Companion = "https://github.com/Stimurid/nisaba"

[project.scripts]
thoth = "thoth.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["thoth*"]
